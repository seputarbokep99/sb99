name: Check URL Status

on:
  schedule:
    - cron: '*/30 * * * *'   # tiap 30 menit
  workflow_dispatch: {}       # bisa dijalankan manual dari tab Actions

permissions:
  contents: write             # wajib, biar job ini boleh push balik ke repo

jobs:
  check-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install cloudscraper

      - name: Jalankan pengecekan URL
        run: python3 check_urls.py

      - name: Commit dan push perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add index.html

          # Tambahkan page*.html satu-satu HANYA kalau memang ada filenya.
          # (git add langsung ke pattern 'page*.html' akan error kalau
          # tidak ada file yang cocok, misal saat cuma ada 1 halaman)
          shopt -s nullglob
          for f in page*.html; do
            git add "$f"
          done
          shopt -u nullglob

          # Tangani file page*.html yang sudah dihapus dari working directory
          # (karena jumlah halaman berkurang) tapi masih tercatat di git
          for f in $(git ls-files 'page*.html'); do
            if [ ! -f "$f" ]; then
              git rm --cached "$f"
            fi
          done

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan, skip commit."
          else
            git commit -m "Update URL status: $(TZ='Asia/Jakarta' date '+%Y-%m-%d %H:%M:%S WIB')"
            git push
          fi
