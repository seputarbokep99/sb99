name: Check URL Status

on:
  schedule:
    - cron: '*/30 * * * *' # otomatis jalan tiap 30 menit
  workflow_dispatch: {} # bisa dijalankan manual dari tab Actions
  push:
    branches:
      - main # otomatis jalan setiap ada push/commit file apa aja di branch main

permissions:
  contents: write # wajib, biar job ini boleh push balik ke repo

jobs:
  check-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install cloudscraper

      - name: Jalankan pengecekan URL
        run: python3 check_urls.py

      - name: Commit dan push perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add index.html

          # Hapus tracking file page*.html peninggalan versi lama (kalau ada),
          # karena sekarang paginasi full client-side dalam satu index.html
          for f in $(git ls-files 'page*.html' 2>/dev/null); do
            git rm -f "$f"
          done

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan, skip commit."
          else
            git commit -m "Update URL status: $(TZ='Asia/Jakarta' date '+%Y-%m-%d %H:%M:%S WIB')"
            
            # Tarik perubahan terbaru dulu biar tidak bentrok
            git pull --rebase origin main
            git push origin main
          fi
