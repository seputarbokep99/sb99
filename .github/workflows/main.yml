name: Check URL Status

# Jadwal otomatis: Setiap 30 menit
# Bisa juga dijalankan manual lewat tab Actions
on:
  schedule:
    - cron: '*/30 * * * *' 
  workflow_dispatch:

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Ambil kode dari repo
      - uses: actions/checkout@v3
      
      # 2. Jalankan script curl untuk cek status & bikin HTML
      - name: Generate Status Page
        run: |
          # DAFTAR URL YANG MAU Dicek (Tambah/Kurang sesuka hati)
          URLS=(
            "https://www.eporner.com/video-Rvz6GjfK17K/i-i/"
            "https://google.com"
            "https://example.com/this-page-does-not-exist"
            "https://httpbin.org/status/200"
          )

          # Mulai tulis file index.html
          cat > index.html << 'HEADER'
          <!DOCTYPE html>
          <html lang="id">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>URL Status Checker</title>
              <style>
                  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
                  h1 { border-bottom: 2px solid #eee; padding-bottom: 10px; }
                  ul { list-style: none; padding: 0; }
                  li { background: #f9f9f9; padding: 15px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; word-break: break-all; }
                  .status { font-weight: bold; padding: 5px 10px; border-radius: 4px; min-width: 100px; text-align: center; }
                  .ok { background: #d4edda; color: #155724; }
                  .err { background: #f8d7da; color: #721c24; }
                  .warn { background: #fff3cd; color: #856404; }
                  .footer { margin-top: 30px; font-size: 0.8em; color: #666; text-align: center; }
              </style>
          </head>
          <body>
              <h1>🔍 URL Status Checker</h1>
              <ul>
          HEADER

          # Loop cek setiap URL
          for u in "${URLS[@]}"; do
            # CURL DENGAN USER-AGENT & TIMEOUT (PENTING!)
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 15 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36" "$u")
            
            # Tentukan warna berdasarkan status
            if [[ "$STATUS" =~ ^2[0-9]{2}$ ]]; then
              CLASS="ok"
            elif [[ "$STATUS" == "000" || "$STATUS" == "0" ]]; then
              STATUS="BLOCKED/TIMEOUT"
              CLASS="warn"
            else
              CLASS="err"
            fi
            
            echo "<li><span>$u</span> <span class='status $CLASS'>$STATUS</span></li>" >> index.html
          done

          # Tutup tag HTML
          cat >> index.html << 'FOOTER'
              </ul>
              <div class="footer">Last updated: $(date -u)</div>
          </body>
          </html>
          FOOTER

      # 3. Push hasil ke repo agar muncul di GitHub Pages
      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update URL status: $(date -u)" || echo "No changes to commit"
          git push
