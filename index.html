<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Status Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .url-item {
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .status-200 { color: green; }
        .status-404 { color: red; }
        .status-error { color: orange; }
    </style>
</head>
<body>
    <h1>URL Status Checker</h1>
    <div id="results"></div>

    <script>
        const urls = [
            "https://www.eporner.com/video-Rvz6GjfK17K/i-i/",
            "https://example.com",
            "https://google.com"
        ];

        async function checkStatus(url) {
            try {
                // Menggunakan API publik untuk bypass CORS
                const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
                const data = await response.json();
                return data.status?.http_code || 'Unknown';
            } catch (error) {
                return 'Error';
            }
        }

        async function displayResults() {
            const resultsDiv = document.getElementById('results');
            
            for (const url of urls) {
                const status = await checkStatus(url);
                const div = document.createElement('div');
                div.className = 'url-item';
                div.innerHTML = `
                    <strong>${url}</strong> 
                    <span class="status-${status}">[${status}]</span>
                `;
                resultsDiv.appendChild(div);
            }
        }

        displayResults();
    </script>
</body>
</html>
