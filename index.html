<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SeputarBokep99 💦</title>
<style>
  :root {
    --bg: #121212;
    --card-bg: #1e1e1e;
    --text: #e8e8e8;
    --muted: #a0a0a0;
    --border: #333333;
    --header-bg: #262626;
    --link: #64b5f6;
    --input-bg: #2a2a2a;
    --btn-bg: #2a2a2a;
    --btn-text: #64b5f6;
    --accent: #64b5f6;
    --hover-bg: #2c2c2c;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* Header */
  header {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
  }

  h1 { 
    font-size: 24px; 
    font-weight: 800; 
    letter-spacing: -0.5px;
    color: var(--text);
    cursor: pointer;
    display: inline-block;
    text-decoration: none;
  }
  h1:hover { opacity: 0.8; }

  /* Search Bar */
  .search-container {
    width: 100%;
    max-width: 1000px;
    margin: 20px auto;
    display: flex;
    gap: 0;
    padding: 0 24px;
  }
  #searchBox {
    flex: 1;
    padding: 14px 20px;
    border: 2px solid var(--border);
    border-right: none;
    border-radius: 0;
    font-size: 16px;
    background: var(--input-bg);
    color: var(--text);
    outline: none;
  }
  #searchBox:focus { border-color: var(--accent); border-right-color: var(--accent); }
  
  #searchBtn {
    padding: 14px 28px;
    border: 2px solid var(--accent);
    border-radius: 0;
    background: var(--accent);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  #searchBtn:hover { opacity: 0.9; }

  /* Category Wrapper */
  .category-wrapper {
    background: var(--bg);
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    overflow-x: auto;
    white-space: nowrap;
  }
  
  .category-tabs {
    display: flex;
    gap: 0;
    flex: 1;
  }
  
  .tab {
    padding: 10px 24px;
    border-radius: 0;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-right: none;
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .tab:last-child { border-right: 1px solid var(--border); }
  .tab:hover { background: var(--hover-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  /* Burger Button - Hidden di desktop */
  .burger-btn {
    display: none;
    padding: 10px 16px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 0;
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .burger-btn:hover { background: var(--hover-bg); }

  /* Main Grid */
  main {
    flex: 1;
    width: 100%;
    padding: 24px;
    margin: 0;
  }

  .video-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 0;
    width: 100%;
  }

  .video-card {
    background: var(--card-bg);
    border-radius: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    border-right: none;
    border-bottom: none;
    height: 100%;
  }
  
  .video-card:nth-child(4n) { border-right: 1px solid var(--border); }
  .video-card:nth-last-child(-n+4) { border-bottom: 1px solid var(--border); }

  .cover-container {
    position: relative;
    width: 100%;
    background: var(--header-bg);
    overflow: hidden;
    display: block;
    cursor: pointer;
  }
  
  .cover-container.ratio-16-9 { aspect-ratio: 16 / 9; }
  .cover-container.ratio-3-2 { aspect-ratio: 3 / 2; }

  .cover-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .cover-img.broken { opacity: 0.5; }
  
  .no-cover {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 14px;
    background: var(--header-bg);
  }

  .card-info {
    padding: 12px;
    flex: 1;
    display: flex;
    flex-direction: column;
    border-top: 1px solid var(--border);
    background: var(--card-bg);
  }

  .video-title {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.4;
    color: var(--text);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .no-result {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 18px;
    background: var(--card-bg);
    border: 1px dashed var(--border);
  }

  /* Pagination */
  .pagination {
    display: flex;
    justify-content: center;
    gap: 0;
    margin-top: 32px;
    padding: 0;
  }
  
  .page-btn {
    padding: 10px 18px;
    border-radius: 0;
    background: var(--card-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-right: none;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.2s;
  }
  .page-btn:last-child { border-right: 1px solid var(--border); }
  .page-btn:hover:not(.disabled) { background: var(--hover-bg); }
  .page-btn.active { 
    background: var(--accent); 
    color: #fff; 
    border-color: var(--accent);
  }
  .page-btn.disabled { 
    opacity: 0.5; 
    cursor: not-allowed;
  }

  /* Footer */
  footer {
    background: var(--card-bg);
    border-top: 1px solid var(--border);
    padding: 24px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin-top: auto;
  }

  /* Responsive - Mobile & Tablet */
  @media (max-width: 768px) {
    .video-grid { 
      grid-template-columns: 1fr;
    }
    
    header { padding: 12px 16px; }
    .search-container { padding: 0 16px; margin: 16px auto; }
    .category-wrapper { 
      padding: 12px 16px; 
      flex-direction: column;
      align-items: stretch;
    }
    main { padding: 16px; }
    .card-info { padding: 12px; }
    .video-title { font-size: 14px; }
    
    .burger-btn { display: block; margin-bottom: 0; }
    
    .category-tabs {
      display: none;
      flex-direction: column;
      margin-top: 8px;
    }
    .category-tabs.open {
      display: flex;
    }
    .tab {
      border-right: 1px solid var(--border);
      border-bottom: none;
    }
    .tab:last-child { border-bottom: 1px solid var(--border); }
    
    .video-card { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .video-card:nth-child(4n) { border-right: 1px solid var(--border); }
    .video-card:nth-last-child(-n+4) { border-bottom: 1px solid var(--border); }
    
    /* Pagination responsive */
    .pagination {
      flex-wrap: wrap;
      gap: 0;
    }
    .page-btn {
      padding: 8px 14px;
      font-size: 13px;
    }
  }
</style>
</head>

<script>
(function () {
  var ALL_DATA = JSON.parse(document.getElementById("video-data").textContent);
  var ITEMS_PER_PAGE = 30; // Batas card per halaman
  var currentPage = 1;
  var currentCategory = null;
  var filtered = [];

  var videoGrid = document.getElementById("videoGrid");
  var noResult = document.getElementById("noResult");
  var paginationEl = document.getElementById("pagination");
  var searchBox = document.getElementById("searchBox");
  var searchBtn = document.getElementById("searchBtn");
  var categoryTabsEl = document.getElementById("categoryTabs");
  var burgerBtn = document.getElementById("burgerBtn");

  function escapeHtml(str) {
    var div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function createCard(item) {
    var ratioClass = item.rasio === "3:2" ? "ratio-3-2" : "ratio-16-9";
    var coverHtml = item.cover 
      ? '<img src="' + escapeHtml(item.cover) + '" alt="cover" loading="lazy" class="cover-img" onerror="this.onerror=null;this.classList.add(\'broken\');this.alt=\'Error\';">'
      : '<div class="no-cover">No Cover</div>';
    
    var coverLink = '<a href="' + escapeHtml(item.url) + '" target="_blank" rel="noopener noreferrer" class="cover-container ' + ratioClass + '">' + coverHtml + '</a>';

    return '<div class="video-card">' +
      coverLink +
      '<div class="card-info"><div class="video-title">' + escapeHtml(item.judul) + '</div></div>' +
    '</div>';
  }

  function renderCategoryTabs() {
    var categories = [];
    ALL_DATA.forEach(function (item) {
      if (categories.indexOf(item.kategori) === -1) categories.push(item.kategori);
    });

    if (categories.length === 0) {
      categoryTabsEl.parentElement.style.display = 'none';
      return;
    }

    if (!currentCategory && categories.length > 0) currentCategory = categories[0];

    categoryTabsEl.innerHTML = categories.map(function (cat) {
      var activeClass = cat === currentCategory ? " active" : "";
      return '<span class="tab' + activeClass + '" data-cat="' + escapeHtml(cat) + '">' + escapeHtml(cat) + '</span>';
    }).join("");

    categoryTabsEl.querySelectorAll(".tab").forEach(function (el) {
      el.addEventListener("click", function () {
        currentCategory = el.getAttribute("data-cat");
        currentPage = 1; // Reset ke halaman 1 saat ganti kategori
        applyFilter();
        renderCategoryTabs();
        categoryTabsEl.classList.remove("open");
      });
    });
  }

  function render() {
    var totalItems = filtered.length;
    var totalPages = Math.max(1, Math.ceil(totalItems / ITEMS_PER_PAGE));
    
    // Validasi halaman
    if (currentPage > totalPages) currentPage = totalPages;
    if (currentPage < 1) currentPage = 1;

    var start = (currentPage - 1) * ITEMS_PER_PAGE;
    var pageItems = filtered.slice(start, start + ITEMS_PER_PAGE);

    if (pageItems.length === 0) {
      videoGrid.innerHTML = "";
      noResult.style.display = "block";
    } else {
      noResult.style.display = "none";
      videoGrid.innerHTML = pageItems.map(createCard).join("");
    }

    renderPagination(totalPages);
  }

  function renderPagination(totalPages) {
    if (totalPages <= 1) {
      paginationEl.innerHTML = "";
      return;
    }
    
    var parts = [];
    
    // Tombol Pertama
    parts.push('<button class="page-btn' + (currentPage === 1 ? ' disabled' : '') + '" data-page="1">Pertama</button>');
    
    // Hitung range halaman yang ditampilkan
    var startPage = Math.max(1, currentPage - 2);
    var endPage = Math.min(totalPages, currentPage + 2);
    
    // Ellipsis di awal
    if (startPage > 1) {
      parts.push('<span class="page-btn disabled">...</span>');
    }
    
    // Nomor halaman
    for (var p = startPage; p <= endPage; p++) {
      parts.push('<button class="page-btn' + (p === currentPage ? ' active' : '') + '" data-page="' + p + '">' + p + '</button>');
    }
    
    // Ellipsis di akhir
    if (endPage < totalPages) {
      parts.push('<span class="page-btn disabled">...</span>');
    }
    
    // Tombol Terakhir
    parts.push('<button class="page-btn' + (currentPage === totalPages ? ' disabled' : '') + '" data-page="' + totalPages + '">Terakhir</button>');

    paginationEl.innerHTML = parts.join("\n");
    
    // Event listener untuk tombol pagination
    paginationEl.querySelectorAll(".page-btn:not(.disabled)").forEach(function (el) {
      el.addEventListener("click", function () {
        currentPage = parseInt(el.getAttribute("data-page"), 10);
        render();
        window.scrollTo({ top: 0, behavior: "smooth" }); // Scroll ke atas
      });
    });
  }

  function applyFilter() {
    var q = searchBox.value.trim().toLowerCase();
    filtered = ALL_DATA.filter(function (item) {
      var matchCategory = !currentCategory || item.kategori === currentCategory;
      var matchSearch = !q || item.judul.toLowerCase().indexOf(q) > -1;
      return matchCategory && matchSearch;
    });
    render();
  }

  // Tombol Cari
  searchBtn.addEventListener("click", function () {
    currentPage = 1;
    applyFilter();
  });

  searchBox.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      currentPage = 1;
      applyFilter();
    }
  });

  // Burger Menu Toggle
  burgerBtn.addEventListener("click", function () {
    categoryTabsEl.classList.toggle("open");
  });

  // Init
  renderCategoryTabs();
  applyFilter();
})();
</script>
