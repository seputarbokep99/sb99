<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Status Checker</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .result-item { margin-bottom: 10px; padding: 10px; border-bottom: 1px solid #eee; }
        .status-ok { color: green; font-weight: bold; }
        .status-error { color: red; font-weight: bold; }
        .loading { color: gray; }
    </style>
</head>
<body>

    <h1>URL Status Checker</h1>
    <div id="results">Loading...</div>

    <script>
        // DAFTAR URL KAMU DI SINI
        const urls = [
            "https://www.eporner.com/video-Rvz6GjfK17K/i-i/",
            "https://google.com",
            "https://example.com/this-page-does-not-exist" 
        ];

        const resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = ''; // Clear loading text

        async function checkUrls() {
            for (const url of urls) {
                const div = document.createElement('div');
                div.className = 'result-item';
                
                // Tampilkan status "Checking..." dulu
                div.innerHTML = `${url} <span class="loading">[Checking...]</span>`;
                resultsDiv.appendChild(div);

                try {
                    // Kita pakai method HEAD biar cepat (gak download full page)
                    // Note: Ini bisa kena CORS error kalau server target galak
                    const response = await fetch(url, { method: 'HEAD', mode: 'no-cors' });
                    
                    // Karena 'no-cors', kita sering gak bisa baca status code aslinya (opaque response)
                    // Jadi ini trick sederhana: kalau gak error network, anggap oke (tapi kurang akurat untuk detail code)
                    
                    // --- ALTERNATIF LEBIH AKURAT (PAKE PROXY) ---
                    // Kalau mau status code asli (200/404), ganti baris fetch di atas dengan ini:
                    // const proxyUrl = 'https://api.allorigins.win/raw?url='; 
                    // const response = await fetch(proxyUrl + encodeURIComponent(url));
                    
                    let status = response.status;
                    let statusClass = status >= 200 && status < 300 ? 'status-ok' : 'status-error';
                    
                    div.innerHTML = `${url} <span class="${statusClass}">[${status}]</span>`;

                } catch (error) {
                    div.innerHTML = `${url} <span class="status-error">[Error/CORS]</span>`;
                }
            }
        }

        checkUrls();
    </script>
</body>
</html>
